
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplos de Animações</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <section class="card">
            <span class="numero">01</span>
            <h2>Transition</h2>
            <p>Aplicar uma transição suave em um botão, card, link ou imagem.</p>
            <button class="botao-transicao">Passe o mouse</button>
        </section>

        <section class="card">
            <span class="numero">02</span>
            <h2>@keyframes</h2>
            <p>Criar uma animação simples com deslocamento, opacidade ou outro efeito discreto.</p>
            <div class="animacao">Animação</div>
        </section>

        <section class="card">
            <span class="numero">03</span>
            <h2>JavaScript</h2>
            <p>Usar evento de clique e alterar uma classe do elemento.</p>
            <button id="botao" class="botao-js">Clique aqui</button>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
